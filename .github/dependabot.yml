version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/foundation
      - /infra/warehouse
      - /infra/controllers
      - /infra/dns
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
