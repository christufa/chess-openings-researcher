name: Kubernetes containers
on:
  pull_request:
    # lean-private-platform**: stacked PRs for the platform rework get checks too.
    branches: [main, develop, 'lean-private-platform**']
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt 'playwright==1.64.0'
      - name: Validate charts, GitOps apps and network policies
        run: python tests/validate_platform_charts.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the UI into the package
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
          cp -r web/dist/. src/openings_research/web/
      - name: Browser smoke with authored fixture
        run: |
          python -m playwright install --with-deps chromium
          python -m uvicorn preview_app:app --app-dir tests --host 127.0.0.1 --port 18080 > /tmp/openings-preview.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          python tests/browser_smoke.py
      - name: Build worker
        run: docker build -f docker/Dockerfile.worker --build-arg CODE_VERSION="$GITHUB_SHA" -t openings-worker:test .
      - name: Iceberg integration without provider credentials
        run: >-
          docker run --rm --read-only --tmpfs /tmp:rw,exec,size=2g --memory 4g --cpus 2
          --entrypoint /opt/spark/bin/spark-submit openings-worker:test
          --master 'local[2]' --driver-memory 2g /opt/research/smoke_iceberg.py
      - name: Build API and explorer
        run: docker build -f docker/Dockerfile.api -t openings-api:test .
      - name: Verify API starts without write access or provider keys
        run: |
          docker run -d --name openings-api-test --read-only --tmpfs /tmp:rw,size=64m -p 127.0.0.1:8000:8000 openings-api:test
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/api/openapi.json > /dev/null
          curl --fail http://127.0.0.1:8000/ > /dev/null
      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openings-worker:test
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-worker.json
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Fail on fixable critical vulnerabilities in the worker image
        run: python .github/scripts/trivy_report.py trivy-worker.json openings-worker
      - name: Scan api image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openings-api:test
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-api.json
          exit-code: "0"
          trivyignores: .trivyignore
      - name: Fail on fixable critical vulnerabilities in the api image
        run: python .github/scripts/trivy_report.py trivy-api.json openings-api
      - name: Render deployment chart
        run: >-
          helm lint deploy/chart --set workerImage=example/worker:test --set apiImage=example/api:test
          --set catalogUri=http://catalog.invalid/catalog --set storageAccount=fixture
      - if: always()
        run: docker rm -f openings-api-test || true
