name: Python and infrastructure CI

on:
  pull_request:
    # lean-private-platform**: stacked PRs for the platform rework get checks too.
    branches: [main, develop, 'lean-private-platform**']
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate every workflow, including manual publication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: python -m build --wheel
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.5'
      - name: Validate infrastructure without cloud credentials
        run: |
          terraform fmt -check -recursive infra
          for stack in bootstrap platform compute gitops; do
            terraform -chdir="infra/$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$stack" validate
            if [ -d "infra/$stack/tests" ]; then terraform -chdir="infra/$stack" test; fi
          done

