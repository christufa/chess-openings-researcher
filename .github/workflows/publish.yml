name: Publish verified production images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-image-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    # Register only disposable, single-job runners with this label. Never use it for PRs.
    runs-on: [self-hosted, linux, x64, openings-production]
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        component: [api, worker]
    env:
      REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate publication settings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REGISTRY" =~ ^[a-z0-9]+\.azurecr\.io$ ]]
          [[ "$COMPONENT" == api || "$COMPONENT" == worker ]]
          install -d -m 700 "$RUNNER_TEMP/docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_PUBLISHER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to the private registry
        shell: bash
        run: az acr login --name "${REGISTRY%.azurecr.io}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build candidate with provenance and SBOM
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/openings-${{ matrix.component }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: CODE_VERSION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Scan candidate before signing
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.76.0
          image-ref: ${{ vars.ACR_LOGIN_SERVER }}/openings-${{ matrix.component }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          scanners: vuln
          format: table
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with:
          cosign-release: v3.1.4
      - name: Sign and verify the immutable candidate
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/openings-$COMPONENT@$IMAGE_DIGEST"
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity "https://github.com/christufa/chess-openings-researcher/.github/workflows/publish.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > "$RUNNER_TEMP/verification.json"
          jq -n --arg component "$COMPONENT" --arg image "$image" --arg revision "$GITHUB_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{component:$component,image:$image,revision:$revision,build_run:$run}' > "$RUNNER_TEMP/release.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.component }}
          path: ${{ runner.temp }}/release.json
          retention-days: 14
          if-no-files-found: error
      - name: Clear registry login
        if: always()
        shell: bash
        run: docker logout "$REGISTRY"
