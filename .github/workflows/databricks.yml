name: Python CI and optional Databricks deploy

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_databricks:
        description: Deploy the legacy Databricks bundle (requires a reachable workspace)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Tests and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: python -m build --wheel
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.16.5'
      - name: Validate infrastructure without cloud credentials
        run: |
          terraform fmt -check -recursive infra
          for stack in bootstrap foundation warehouse dns; do
            terraform -chdir="infra/$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="infra/$stack" validate
            terraform -chdir="infra/$stack" test
          done

  deploy:
    name: Deploy Databricks dev
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' && inputs.deploy_databricks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: databricks-dev
    concurrency:
      group: databricks-openings-dev-deploy
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_AUTH_TYPE: pat
      EXPECTED_DATABRICKS_USER: ${{ vars.DATABRICKS_DEPLOY_USER }}
      BUNDLE_VAR_code_version: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7
        with:
          version: '1.19.0'
      - run: python -m pip install 'build>=1.2,<2'
      - name: Check deployment identity
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABRICKS_HOST:?Set databricks-dev DATABRICKS_HOST}"
          : "${DATABRICKS_TOKEN:?Set databricks-dev DATABRICKS_TOKEN}"
          : "${EXPECTED_DATABRICKS_USER:?Set databricks-dev DATABRICKS_DEPLOY_USER}"
          actual_user="$(databricks current-user me --output json | jq -r '.userName')"
          if [[ "$actual_user" != "$EXPECTED_DATABRICKS_USER" ]]; then
            echo '::error::Deployment identity differs from the configured bundle owner.'
            exit 1
          fi
      - run: databricks bundle validate --target dev
      - run: databricks bundle deploy --target dev --auto-approve --fail-on-active-runs
      - name: Deployment summary
        run: databricks bundle summary --target dev >> "$GITHUB_STEP_SUMMARY"
