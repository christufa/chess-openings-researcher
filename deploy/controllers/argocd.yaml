configs:
  cm:
    admin.enabled: "false"
    users.anonymous.enabled: "false"
  rbac:
    policy.default: role:none
    policy.csv: ""
server:
  replicas: 2
  service:
    type: ClusterIP
  ingress:
    enabled: false
repoServer:
  replicas: 2
applicationSet:
  replicas: 0
extraObjects:
  - apiVersion: argoproj.io/v1alpha1
    kind: AppProject
    metadata:
      name: default
      namespace: argocd
    spec:
      sourceRepos: []
      destinations: []
      clusterResourceWhitelist: []
      namespaceResourceBlacklist:
        - {group: '*', kind: '*'}
# Initial administration uses argocd --core through Entra-authenticated kubectl.
# No public UI or local password account is enabled.
