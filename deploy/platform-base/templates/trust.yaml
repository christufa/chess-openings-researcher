apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: internal-ca
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: openings-root-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    additionalFormats:
      jks:
        key: truststore.jks
    namespaceSelector:
      matchLabels:
        openings.generops.dev/trust: "true"
