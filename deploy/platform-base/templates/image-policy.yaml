{{- $registry := required "registry is required" .Values.registry }}
{{- if not (regexMatch "^[a-z0-9]+\\.azurecr\\.io$" $registry) }}
{{- fail "registry must be an Azure registry hostname" }}
{{- end }}
# Built-in admission (no Kyverno): research pods may run only digest-pinned images
# from this cluster's registry, plus the pinned Argo executor.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: openings-image-origins
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.matches('^{{ $registry | replace "." "[.]" }}/openings-(api|worker)@sha256:[0-9a-f]{64}$') ||
          (object.metadata.namespace == 'openings-research' && c.image == 'quay.io/argoproj/argoexec:v4.1.5@sha256:8275c3b970f399e9264ebd5f57e17f554e7494046d0f36f5f05ae2570a601de2'))
      message: Only immutable application images and the explicitly pinned platform images are allowed.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: openings-image-origins
spec:
  policyName: openings-image-origins
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [openings-research]
