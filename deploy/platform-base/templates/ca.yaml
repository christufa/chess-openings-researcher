apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openings-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openings-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Openings internal CA
  secretName: openings-root-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    kind: ClusterIssuer
    name: openings-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openings-internal-ca
spec:
  ca:
    secretName: openings-root-ca
