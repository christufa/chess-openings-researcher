# Lakekeeper (deploy/apps/lakekeeper.yaml) signs in to the research storage account as the catalog identity
# (infra/compute) and vends table-scoped credentials to the worker and API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lakekeeper
  annotations:
    azure.workload.identity/client-id: {{ required "catalogClientId is required" .Values.catalogClientId | quote }}
---
# The Lakekeeper chart renders its RBAC only when it creates the service account itself,
# and it doesn't (the account above carries the workload identity). Without this binding,
# TokenReview is forbidden and every client gets 401 Authentication failed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lakekeeper-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: lakekeeper
    namespace: {{ .Release.Namespace }}
---
# Lakekeeper watches its migration Job to know the database schema is ready.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lakekeeper-jobs
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lakekeeper-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lakekeeper-jobs
subjects:
  - kind: ServiceAccount
    name: lakekeeper
    namespace: {{ .Release.Namespace }}
