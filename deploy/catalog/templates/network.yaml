# The catalog's only authorization boundary (no OpenFGA): default-deny ingress, then
# the research worker and API may call the catalog API, and Lakekeeper and the
# CloudNativePG operator may reach the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-private-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lakekeeper
      app.kubernetes.io/component: catalog
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openings-research}
          podSelector:
            matchExpressions:
              - {key: openings.generops.dev/role, operator: In, values: [worker, api]}
      ports: [{protocol: TCP, port: 8181}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-database
spec:
  podSelector:
    matchExpressions:
      - {key: cnpg.io/cluster, operator: Exists}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lakekeeper}
        - podSelector:
            matchExpressions:
              - {key: cnpg.io/cluster, operator: Exists}
      ports: [{protocol: TCP, port: 5432}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: cnpg-system}
      ports: [{protocol: TCP, port: 8000}, {protocol: TCP, port: 5432}]
