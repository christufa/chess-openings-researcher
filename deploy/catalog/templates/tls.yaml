apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: catalog-tls
spec:
  secretName: catalog-tls
  dnsNames:
    - catalog-tls
    - catalog-tls.openings-catalog.svc
    - catalog-tls.openings-catalog.svc.cluster.local
  duration: 2160h
  renewBefore: 720h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  issuerRef: {kind: ClusterIssuer, name: openings-internal-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-tls
spec:
  selector:
    app.kubernetes.io/name: lakekeeper
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: catalog
  ports: [{name: https, port: 8443, targetPort: catalog-https}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-tls-proxy
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 512; }
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      server {
        listen 8443 ssl;
        ssl_certificate /etc/catalog-tls/tls.crt;
        ssl_certificate_key /etc/catalog-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 2m;
        location = /healthz { return 200 'ok'; }
        location / {
          proxy_pass http://127.0.0.1:8181;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_connect_timeout 5s;
          proxy_read_timeout 60s;
        }
      }
    }
