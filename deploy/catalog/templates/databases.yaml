apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: catalog-pg
  labels:
    azure.workload.identity/use: "true"
spec:
  instances: 1
  imageName: {{ .Values.postgresImage | quote }}
  enableSuperuserAccess: false
  inheritedMetadata:
    labels:
      azure.workload.identity/use: "true"
  serviceAccountTemplate:
    metadata:
      annotations:
        azure.workload.identity/client-id: {{ required "backup.clientId is required" .Values.backup.clientId | quote }}
  storage:
    size: 8Gi
    storageClass: managed-csi
  bootstrap:
    initdb:
      database: catalog
      owner: catalog
      dataChecksums: true
  affinity:
    nodeSelector:
      kubernetes.azure.com/agentpool: system
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: catalog-backup
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: catalog-backup
spec:
  retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ printf "%s/catalog" (required "backup.destination is required" .Values.backup.destination) | quote }}
    azureCredentials:
      inheritFromAzureAD: true
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: catalog-daily
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: catalog-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
