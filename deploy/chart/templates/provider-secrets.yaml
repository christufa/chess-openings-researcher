{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openings-secrets
  annotations:
    azure.workload.identity/client-id: {{ required "secrets.clientId is required" .Values.secrets.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "secrets.tenantId is required" .Values.secrets.tenantId | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openings-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "secrets.vaultUrl is required" .Values.secrets.vaultUrl | quote }}
      serviceAccountRef:
        name: openings-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openings-provider-keys
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openings-vault
  target:
    name: {{ .Values.providerSecret | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: openai-api-key
    - secretKey: TAVILY_API_KEY
      remoteRef:
        key: tavily-api-key
{{- end }}
