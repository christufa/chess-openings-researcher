apiVersion: apps/v1
kind: Deployment
metadata:
  name: openings-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: openings-api}
  template:
    metadata:
      labels:
        app: openings-api
        openings.generops.dev/role: api # the catalog only admits worker and API pods
    spec:
      serviceAccountName: openings-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ required "apiImage digest is required" .Values.apiImage | quote }}
          ports: [{containerPort: 8000, name: http}]
          envFrom: [{configMapRef: {name: openings-config}}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi} # whole small tables are held in memory
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          readinessProbe: # the catalog is reachable and the research namespace readable
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 10
            periodSeconds: 30
          volumeMounts:
            - {name: catalog-token, mountPath: /var/run/research/catalog, readOnly: true}
            - {name: scratch, mountPath: /tmp}
      volumes:
        # The API has no storage role: it reads with the table-scoped SAS tokens Lakekeeper
        # vends. With allowall authorization those are not read-only; the API code only
        # reads (no write path exists). The token is re-read whenever the kubelet rotates it.
        - name: catalog-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ .Values.catalogTokenAudience | quote }}
                  expirationSeconds: 3600
                  path: token
        - name: scratch
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: openings-api
spec:
  selector: {app: openings-api}
  ports: [{port: 80, targetPort: http}]
---
# No ingress route is installed. Start with an authenticated kubectl port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openings-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
