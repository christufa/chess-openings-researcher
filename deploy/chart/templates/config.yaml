apiVersion: v1
kind: ConfigMap
metadata:
  name: openings-config
data:
  OPENINGS_CATALOG: {{ .Values.catalog | quote }}
  OPENINGS_CATALOG_URI: {{ required "catalogUri is required" .Values.catalogUri | quote }}
  OPENINGS_WAREHOUSE: {{ .Values.warehouse | quote }}
  OPENINGS_FILE_IO: {{ .Values.fileIO | quote }}
  OPENINGS_CATALOG_TOKEN_FILE: /var/run/research/catalog/token
  {{- with .Values.azureOpenAI.endpoint }}
  OPENINGS_AZURE_OPENAI_ENDPOINT: {{ . | quote }}
  {{- end }}
  # The API reads the same catalog and warehouse; "<catalog>.<schema>" names its tables.
  OPENINGS_READ_NAMESPACE: {{ printf "%s.openings_research" .Values.catalog | quote }}
---
# Workflow pods run as this account. With workflowLogs.clientId it also signs in to Azure
# as the workflows identity, whose only role is writing the workflow-logs container.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openings-worker
  {{- with .Values.workflowLogs.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openings-api
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openings-workflow-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openings-workflow-executor
subjects:
  - kind: ServiceAccount
    name: openings-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openings-workflow-executor
{{- if .Values.workflowLogs.clientId }}
---
# Default artifact repository for workflows in this namespace: archived step logs go to
# the workflow-logs container, written by the workflow pods themselves (useSDKCreds →
# DefaultAzureCredential → workload identity). No keys.
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-repositories
  annotations:
    workflows.argoproj.io/default-artifact-repository: logs
data:
  logs: |
    archiveLogs: true
    azure:
      endpoint: https://{{ required "storageAccount is required for log archiving" .Values.storageAccount }}.blob.core.windows.net
      container: {{ .Values.workflowLogs.container }}
      blobNameFormat: "{{ "{{workflow.creationTimestamp.Y}}/{{workflow.creationTimestamp.m}}/{{workflow.name}}/{{pod.name}}" }}"
      useSDKCreds: true
{{- end }}
