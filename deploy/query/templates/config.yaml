apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
data:
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.enabled=false
    http-server.https.enabled=true
    http-server.https.port=8443
    http-server.https.keystore.path=/etc/trino/tls/tls-combined.pem
    http-server.authentication.type=JWT
    http-server.authentication.jwt.key-file={{ required "aksIssuer is required" .Values.aksIssuer }}openid/v1/jwks
    http-server.authentication.jwt.required-issuer={{ .Values.aksIssuer }}
    http-server.authentication.jwt.required-audience=trino
    http-server.authentication.jwt.principal-field=sub
    http-server.authentication.jwt.user-mapping.pattern=^system:serviceaccount:openings-research:(openings-api)$
    internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
    discovery.uri=https://trino.openings-query.svc.cluster.local:8443
    internal-communication.https.required=true
    query.max-memory=2GB
    query.max-memory-per-node=1GB
    query.max-run-time=30s
  node.properties: |
    node.environment=production
    node.data-dir=/data/trino
  jvm.config: |
    -server
    -Xmx3G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -XX:ReservedCodeCacheSize=256M
    -Djdk.attach.allowAttachSelf=true
    -Djavax.net.ssl.trustStore=/etc/trino/ca/truststore.jks
    -Djavax.net.ssl.trustStorePassword=changeit
  log.properties: |
    io.trino=INFO
  access-control.properties: |
    access-control.name=file
    security.config-file=/etc/trino/access/rules.json
  rules.json: |
    {
      "impersonation": [
        {"original_user":"openings-api","new_user":"openings-api","allow":true},
        {"original_user":".*","new_user":".*","allow":false}
      ],
      "catalogs": [
        {"user":"openings-api","catalog":"research","allow":"read-only"},
        {"catalog":".*","allow":"none"}
      ],
      "schemas": [{"user":"openings-api","catalog":"research","schema":"openings_research","owner":false}],
      "tables": [{"user":"openings-api","catalog":"research","schema":"openings_research","privileges":["SELECT"]}]
    }
  research.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://127.0.0.1:8182/catalog
    iceberg.rest-catalog.warehouse={{ .Values.warehouse }}
    iceberg.rest-catalog.security=NONE
    iceberg.rest-catalog.vended-credentials-enabled=true
    iceberg.security=read_only
    fs.azure.enabled=true
