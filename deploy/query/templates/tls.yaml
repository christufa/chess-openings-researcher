apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trino-tls
spec:
  secretName: trino-tls
  dnsNames: [trino, trino.openings-query.svc, trino.openings-query.svc.cluster.local]
  duration: 2160h
  renewBefore: 720h
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
  additionalOutputFormats:
    - type: CombinedPEM
  issuerRef: {kind: ClusterIssuer, name: openings-internal-ca}
