apiVersion: v1
kind: ServiceAccount
metadata:
  name: openings-secrets
  annotations:
    azure.workload.identity/client-id: {{ required "secrets.clientId is required" .Values.secrets.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "secrets.tenantId is required" .Values.secrets.tenantId | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openings-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ required "secrets.vaultUrl is required" .Values.secrets.vaultUrl | quote }}
      serviceAccountRef:
        name: openings-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-shared-secret
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: openings-vault
  target:
    name: trino-shared-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: trino-shared-secret-key
