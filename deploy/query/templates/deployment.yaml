{{- if not (regexMatch "^[a-z0-9]+\\.azurecr\\.io/openings-api@sha256:[0-9a-f]{64}$" .Values.bridgeImage) }}
{{- fail "bridgeImage must be a signed API image digest in ACR" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trino
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: openings-trino}
  template:
    metadata:
      labels: {app: openings-trino}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: trino
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: trino
          image: {{ .Values.trinoImage | quote }}
          ports: [{name: https, containerPort: 8443}]
          env:
            - name: TRINO_SHARED_SECRET
              valueFrom: {secretKeyRef: {name: trino-shared-secret, key: password}}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: "1", memory: 4Gi}
            limits: {cpu: "4", memory: 5Gi}
          startupProbe:
            tcpSocket: {port: https}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /v1/info, port: https, scheme: HTTPS}
          volumeMounts:
            - {name: config, mountPath: /etc/trino}
            - {name: access, mountPath: /etc/trino/access}
            - {name: catalog, mountPath: /etc/trino/catalog}
            - {name: tls, mountPath: /etc/trino/tls, readOnly: true}
            - {name: ca, mountPath: /etc/trino/ca, readOnly: true}
            - {name: data, mountPath: /data/trino}
            - {name: tmp, mountPath: /tmp}
        - name: catalog-bridge
          image: {{ .Values.bridgeImage | quote }}
          command: [python, -m, openings_research.catalog_proxy]
          env:
            - {name: CATALOG_ORIGIN, value: {{ .Values.catalogOrigin | quote }}}
            - {name: CATALOG_TOKEN_FILE, value: /var/run/catalog/token}
            - {name: CATALOG_CA_FILE, value: /var/run/catalog-ca/ca.crt}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            exec:
              command: [python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8182/healthz',timeout=2)"]
            timeoutSeconds: 3
          volumeMounts:
            - {name: catalog-token, mountPath: /var/run/catalog, readOnly: true}
            - {name: ca, mountPath: /var/run/catalog-ca, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: trino-config
            items:
              - {key: config.properties, path: config.properties}
              - {key: node.properties, path: node.properties}
              - {key: jvm.config, path: jvm.config}
              - {key: log.properties, path: log.properties}
              - {key: access-control.properties, path: access-control.properties}
        - name: access
          configMap:
            name: trino-config
            items: [{key: rules.json, path: rules.json}]
        - name: catalog
          configMap:
            name: trino-config
            items: [{key: research.properties, path: research.properties}]
        - name: tls
          secret: {secretName: trino-tls}
        - name: ca
          configMap: {name: internal-ca}
        - name: catalog-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: lakekeeper
                  expirationSeconds: 3600
                  path: token
        - name: data
          emptyDir: {sizeLimit: 10Gi}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: trino
spec:
  selector: {app: openings-trino}
  ports: [{name: https, port: 8443, targetPort: https}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-query
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: openings-research}
          podSelector:
            matchLabels: {app: openings-api}
      ports: [{protocol: TCP, port: 8443}]
