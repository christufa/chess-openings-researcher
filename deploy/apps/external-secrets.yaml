# External Secrets Operator: copies provider keys and the catalog encryption key from
# Key Vault into Kubernetes Secrets. Each namespace has its own SecretStore and
# openings-secrets service account (deploy/catalog, deploy/chart); no ClusterSecretStore.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: openings
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        resources:
          requests: { cpu: 20m, memory: 64Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # large CRDs
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
