# Barman Cloud plugin for CloudNativePG: archives the catalog database's WAL and base
# backups to the catalog-backups container (deploy/catalog/templates/databases.yaml).
# Needs the operator and cert-manager first, hence wave 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: openings
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    targetRevision: 0.8.1
    helm:
      releaseName: barman-cloud
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true # cert-manager CRDs may not exist on the very first sync
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
