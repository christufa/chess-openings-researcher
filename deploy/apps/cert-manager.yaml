# cert-manager: needed by the Barman Cloud plugin, whose gRPC link to the CloudNativePG
# operator uses certificates it issues. Nothing else here uses TLS inside the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: openings
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
          keep: true
        # Leader-election Roles default to kube-system, which this project may not touch.
        global:
          leaderElection:
            namespace: cert-manager
        resources:
          requests: { cpu: 10m, memory: 64Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        cainjector:
          resources:
            requests: { cpu: 10m, memory: 64Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  # Two fields on cert-manager's webhooks are filled in after the chart renders them, so
  # without this the app shows OutOfSync forever:
  #   - caBundle, injected by cert-manager's CA injector (cert-manager.io/inject-ca-from-secret)
  #   - two namespaceSelector entries AKS's admissions enforcer appends to every webhook so
  #     it never intercepts AKS-managed namespaces (control-plane, kubernetes.azure.com/managedby)
  # Only those entries are ignored; the chart's own selector rule still shows drift.
  # RespectIgnoreDifferences keeps syncs from removing them.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - '.webhooks[]?.namespaceSelector.matchExpressions[]? | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - '.webhooks[]?.namespaceSelector.matchExpressions[]? | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
