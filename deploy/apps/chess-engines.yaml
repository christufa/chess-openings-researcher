# The shared chess-engines API (christufa/chess-engines, chart/chess-engines): Stockfish
# over HTTP for this project's research and for other projects, one instance per cluster.
#
# - Image: chess-engines from this cluster's registry, built and signed by that repository's
#   images workflow, which commits the digest to its deploy-state branch
#   (chess-engines.yaml). Until the first build lands the generator yields nothing, and
#   this Application does not exist yet.
# - Pods run on the on-demand system pool, not the chart's default spot pool: spot cores are
#   a per-subscription regional quota that other clusters' batch pools can use up. KEDA is
#   capped at one replica (two engine processes) to keep that pool's cost bounded.
# - Ingress (the chart's CiliumNetworkPolicy): openings-research, argo and cloudflared only.
#   Other projects come in through cloudflared at chess-engines.<domain>, which Cloudflare
#   Access opens to service tokens only (infra/gitops/edge.tf).
# - Its own AppProject: the chess-engines repository can deploy only namespaced resources
#   into the chess-engines namespace. The namespace itself comes from here (the root app),
#   so that project needs no cluster-scoped kinds.
apiVersion: v1
kind: Namespace
metadata:
  name: chess-engines
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels: # only pods meeting "restricted" may run here
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: chess-engines
  namespace: argocd
spec:
  description: Shared chess-engine analysis API (christufa/chess-engines)
  sourceRepos:
    - https://github.com/christufa/chess-engines.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: chess-engines }
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: "", kind: ConfigMap }
    - { group: "", kind: Service }
    - { group: "", kind: ServiceAccount }
    - { group: apps, kind: Deployment }
    - { group: keda.sh, kind: ScaledObject }
    - { group: cilium.io, kind: CiliumNetworkPolicy }
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: chess-engines
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  openings.generops.dev/facts: "true"
          - git: # image.digest and commit of the newest signed main build
              repoURL: https://github.com/christufa/chess-engines.git
              revision: deploy-state
              files:
                - path: chess-engines.yaml
  # If the file ever went missing, keep the Application (and its workloads).
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: chess-engines
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: chess-engines
      source:
        repoURL: https://github.com/christufa/chess-engines.git
        targetRevision: main
        path: chart/chess-engines
        helm:
          releaseName: chess-engines
          # The chart's spot switch off, not null keys: the ApplicationSet drops nulls from
          # valuesObject, and the chart (christufa/chess-engines#8) now adds the spot selector
          # and toleration only when spot is true.
          values: |
            image: '{{ index .metadata.annotations "openings.generops.dev/acr-login-server" }}/chess-engines@{{ .image.digest }}'
            spot: false
            nodeSelector:
              kubernetes.azure.com/agentpool: system
            autoscaling: { maxReplicas: 1 }
            networkPolicy:
              allowFrom:
                - namespace: openings-research # research batch jobs
                - namespace: argo # Argo Workflows
                - namespace: cloudflared # other projects, through Access service tokens
                  podLabels: { app.kubernetes.io/name: cloudflared }
      destination:
        server: '{{ .server }}'
        namespace: chess-engines
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff: { duration: 30s, factor: 2, maxDuration: 5m }
