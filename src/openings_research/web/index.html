<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Openings Research</title><link rel="stylesheet" href="/style.css"></head>
<body><header><span class="mark">OR</span><div><p class="eyebrow">RESEARCH LIBRARY</p><h1>Openings Research</h1></div><a href="/api/docs">API reference</a></header>
<main><section class="intro"><h2>Explore the ideas behind the moves.</h2><p>Published opening research, linked to its sources. Model-reviewed findings are starting points for study, not verified chess truth.</p></section>
<div class="workspace"><aside><label for="opening">Opening</label><select id="opening"><option>Loading…</option></select><button id="more" hidden>Load more openings</button><label for="run">Published run</label><select id="run" disabled></select><p id="run-info"></p><button id="retry">Refresh library</button></aside>
<section aria-live="polite"><p id="status" role="status">Loading research…</p><div id="metrics" class="metrics"></div><nav aria-label="Research sections"><button data-tab="claims" aria-pressed="true">Ideas &amp; plans</button><button data-tab="lines" aria-pressed="false">Opening lines</button><button data-tab="gaps" aria-pressed="false">Research gaps</button></nav><div id="results"></div><button id="next" hidden>Load more results</button><section id="comparison"><h3>Compare published runs</h3><label for="before">Earlier snapshot</label><select id="before"></select><button id="compare">Compare with selected run</button><pre id="diff"></pre></section></section></div></main><script src="/app.js" defer></script></body></html>
