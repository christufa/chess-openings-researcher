[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openings-researcher"
version = "0.4.0"
description = "Replayable chess opening research collected into Iceberg on Kubernetes"
requires-python = ">=3.11"
dependencies = [
    "chess==1.11.2",
    "pydantic>=2.10,<3",
    "openai==3.35.1",
    "azure-identity==1.26.0",  # keyless Azure OpenAI via workload identity
    "tavily-python==0.7.23",
]

[project.optional-dependencies]
api = [
    "fastapi==0.156.4",
    "uvicorn==0.54.0",
    "pyiceberg[pyarrow,adlfs]==0.12.0",
    "pyarrow==25.0.1",
    "adlfs==2026.8.0",
    "duckdb==1.5.6",
]

[tool.setuptools.package-data]
openings_research = ["web/*.html", "web/*.svg", "web/assets/*", "eco/*.tsv"]  # the built UI (web/), the reference book

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
